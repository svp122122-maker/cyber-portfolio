<!doctype html>
<html lang="uk">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Кібер-портфоліо</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Exo+2:wght@500;600;700&family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans:wght@400;500;600&display=swap">
<style>
body{margin:0}[hidden]{display:none!important}img{max-width:100%}
/* Layout: fixed identity sidebar (emblem, semester list, tools) beside a working area with a filterable link table. Dark by design: terminal over navy. */
:root{
  --bg:#060c19; --bg-2:#0a1326; --panel:#0d192e; --panel-2:#112240;
  --line:#1b2c4b; --line-2:#2a4672;
  --fg:#e7eefc; --muted:#8aa0c2;
  --accent:#3cd2ff; --accent-ink:#031a24;
  --gold:#f2bd4f; --violet:#a99cff; --danger:#ff7088;
  --f-display:'Exo 2','Segoe UI',system-ui,sans-serif;
  --f-body:'IBM Plex Sans','Segoe UI',system-ui,sans-serif;
  --f-mono:'IBM Plex Mono',ui-monospace,Menlo,Consolas,monospace;
  color-scheme:dark;
}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--fg);font-family:var(--f-body);font-size:15px;line-height:1.5;
  padding-block:20px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.bg{position:fixed;inset:0;pointer-events:none;z-index:0;
  background:
    radial-gradient(900px 420px at 78% -6%,rgba(60,210,255,.10),transparent 70%),
    linear-gradient(rgba(60,130,220,.055) 1px,transparent 1px) 0 0/44px 44px,
    linear-gradient(90deg,rgba(60,130,220,.055) 1px,transparent 1px) 0 0/44px 44px;}
.shell{position:relative;z-index:1;max-width:1280px;margin:0 auto;display:grid;grid-template-columns:288px minmax(0,1fr);gap:24px;align-items:start}
button,input,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}

/* sidebar */
.side{position:sticky;top:20px;display:flex;flex-direction:column;gap:20px;background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:20px;max-height:calc(100vh - 40px);overflow:auto;min-width:0}
.brand{display:flex;flex-direction:column;gap:12px}
.logo{display:block;width:104px;height:auto;filter:drop-shadow(0 0 16px rgba(60,210,255,.28))}
.inst{font:500 11px/1.4 var(--f-mono);letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
.who{font:600 21px/1.2 var(--f-display);overflow-wrap:anywhere}
.role{color:var(--muted);font-size:13px;margin-top:2px}
.label{font:500 11px var(--f-mono);letter-spacing:.1em;text-transform:uppercase;color:var(--muted);margin:0 0 8px}
.nav{display:flex;flex-direction:column;gap:2px}
.navitem{display:grid;grid-template-columns:26px minmax(0,1fr) auto;align-items:center;gap:6px;text-align:left;background:none;border:0;border-radius:8px;padding:8px 10px;color:var(--fg)}
.navitem:hover{background:rgba(60,130,220,.1)}
.navitem.on{background:rgba(60,210,255,.12);color:var(--accent)}
.ni-idx{font:500 12px var(--f-mono);color:var(--muted)}
.navitem.on .ni-idx{color:var(--accent)}
.ni-t{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.ni-n{font:500 12px var(--f-mono);font-variant-numeric:tabular-nums;color:var(--fg);background:var(--bg-2);border:1px solid var(--line);border-radius:999px;padding:0 8px;min-width:24px;text-align:center}
.ni-n.zero{color:var(--muted);border-color:transparent;background:none}
.addsec{margin-top:6px}
.tools{display:flex;flex-direction:column;gap:8px;border-top:1px solid var(--line);padding-top:16px}
.toolrow{display:flex;gap:8px;flex-wrap:wrap}
.sync{display:flex;align-items:center;gap:8px;font:400 12px var(--f-mono);color:var(--muted)}
.dot{width:8px;height:8px;border-radius:50%;background:var(--muted);flex:none}
.sync.cloud .dot{background:#4fd1a5}
.sync.saving .dot{background:var(--gold)}
.sync.error .dot{background:var(--danger)}
.sync.local .dot,.sync.ro .dot{background:var(--violet)}

/* buttons */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;border-radius:9px;border:1px solid var(--line-2);background:transparent;padding:8px 14px;font-weight:500;line-height:1.2;min-height:38px}
.btn:hover{border-color:var(--accent);color:var(--accent)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink);font-weight:600}
.btn.primary:hover{filter:brightness(1.08);color:var(--accent-ink)}
.btn.small{min-height:32px;padding:5px 10px;font-size:13px}
.btn.danger{border-color:rgba(255,112,136,.5);color:var(--danger)}
.btn.danger:hover{background:rgba(255,112,136,.12);color:var(--danger);border-color:var(--danger)}
.icon-btn{display:inline-grid;place-items:center;width:32px;height:32px;border-radius:8px;border:1px solid transparent;background:none;color:var(--muted);padding:0}
.icon-btn:hover{color:var(--accent);background:rgba(60,210,255,.1)}
.icon-btn.armed{width:auto;padding:0 10px;color:var(--danger);border-color:rgba(255,112,136,.5);font-size:13px}
svg.i{width:16px;height:16px;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round;flex:none}

/* main */
.main{min-width:0;display:flex;flex-direction:column;gap:18px}
.crumb{font:400 13px var(--f-mono);color:var(--muted);overflow-wrap:anywhere}
.crumb b{color:var(--accent);font-weight:500}
.headrow{display:flex;gap:12px;justify-content:space-between;align-items:flex-start;flex-wrap:wrap}
h1{margin:4px 0 0;font:700 clamp(28px,4.2vw,42px)/1.1 var(--f-display);letter-spacing:-.01em;text-wrap:balance;min-width:0;overflow-wrap:anywhere}
.desc{margin:8px 0 0;color:var(--muted);max-width:64ch}
.stats{display:flex;gap:16px;flex-wrap:wrap;font:400 13px var(--f-mono);color:var(--muted);margin-top:12px}
.stats span{display:inline-flex;align-items:center;gap:6px}
.stats b{color:var(--fg);font-weight:500;font-variant-numeric:tabular-nums}
.sw{width:8px;height:8px;border-radius:2px}
.sw.work{background:var(--accent)}.sw.cert{background:var(--gold)}.sw.link{background:var(--violet)}
.notice{display:flex;gap:12px;align-items:center;justify-content:space-between;flex-wrap:wrap;background:rgba(242,189,79,.08);border:1px solid rgba(242,189,79,.3);border-radius:10px;padding:10px 14px;font-size:13.5px}
.toolbar{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.filters{display:flex;gap:4px;flex-wrap:wrap;background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:4px}
.filt{background:none;border:0;border-radius:7px;padding:6px 12px;color:var(--muted);font-size:13.5px}
.filt:hover{color:var(--fg)}
.filt.on{background:var(--panel-2);color:var(--fg);box-shadow:inset 0 0 0 1px var(--line-2)}
.filt em{font:500 12px var(--f-mono);font-style:normal;margin-left:6px;color:var(--muted);font-variant-numeric:tabular-nums}
.search{flex:1 1 200px;min-width:0}
.field,.search input{width:100%;background:var(--bg-2);border:1px solid var(--line-2);border-radius:9px;padding:9px 12px;min-height:38px}
.field:focus,.search input:focus{border-color:var(--accent);outline:none;box-shadow:0 0 0 3px rgba(60,210,255,.18)}
textarea.field{resize:vertical;min-height:72px}
.grow{flex:1}

/* table */
.tablewrap{background:var(--panel);border:1px solid var(--line);border-radius:14px;overflow-x:auto}
table{width:100%;min-width:680px;border-collapse:collapse}
th{font:500 11px var(--f-mono);letter-spacing:.1em;text-transform:uppercase;color:var(--muted);text-align:left;padding:12px 16px;background:var(--bg-2);white-space:nowrap}
td{padding:14px 16px;border-top:1px solid var(--line);vertical-align:top}
tbody tr:hover td{background:rgba(60,130,220,.05)}
.c-title{min-width:220px}
.c-title strong{display:block;font-weight:600;overflow-wrap:anywhere}
.c-title small,.c-title .note{display:block;color:var(--muted);font-size:13px;overflow-wrap:anywhere}
.c-title .note{margin-top:2px}
.c-date{white-space:nowrap;font:400 13px var(--f-mono);color:var(--muted);font-variant-numeric:tabular-nums}
.c-act{white-space:nowrap;text-align:right;width:1%}
.badge{display:inline-flex;align-items:center;gap:6px;font:500 11px var(--f-mono);letter-spacing:.06em;text-transform:uppercase;border:1px solid;border-radius:6px;padding:2px 8px;white-space:nowrap}
.t-work{color:var(--accent);background:rgba(60,210,255,.1);border-color:rgba(60,210,255,.35)}
.t-cert{color:var(--gold);background:rgba(242,189,79,.1);border-color:rgba(242,189,79,.35)}
.t-link{color:var(--violet);background:rgba(169,156,255,.1);border-color:rgba(169,156,255,.35)}
.ex{margin-left:8px;font:500 10px var(--f-mono);letter-spacing:.08em;color:var(--muted);border:1px dashed var(--line-2);border-radius:4px;padding:1px 6px;vertical-align:middle}
a.ext{display:inline-flex;gap:6px;align-items:center;color:var(--accent);text-decoration:none;font:400 13px var(--f-mono);overflow-wrap:anywhere;word-break:break-all}
a.ext:hover{text-decoration:underline}
.none{color:var(--muted)}
.empty{padding:44px 24px;text-align:center;display:flex;flex-direction:column;align-items:center;gap:14px}
.term{font:400 13px var(--f-mono);color:var(--muted);background:var(--bg-2);border:1px solid var(--line);border-radius:8px;padding:10px 14px;text-align:left;max-width:100%;overflow-wrap:anywhere}
.term b{color:var(--accent);font-weight:500}
.empty p{margin:0;max-width:46ch;color:var(--muted)}
.foot{color:var(--muted);font-size:12.5px;padding:8px 0 4px}

/* dialog */
dialog{background:var(--panel-2);color:var(--fg);border:1px solid var(--line-2);border-radius:14px;padding:0;width:min(540px,calc(100vw - 32px));max-height:calc(100vh - 32px);overflow:auto;box-shadow:0 24px 80px rgba(0,0,0,.55)}
dialog::backdrop{background:rgba(3,8,18,.72)}
.dlg-in{padding:22px;display:flex;flex-direction:column;gap:16px}
.dlg-h{display:flex;justify-content:space-between;align-items:center;gap:12px}
.dlg-h h2{margin:0;font:600 20px var(--f-display)}
form{display:flex;flex-direction:column;gap:14px}
.fld{display:flex;flex-direction:column;gap:6px}
.fld>label,.fld>span.l{font:500 12px var(--f-mono);letter-spacing:.06em;text-transform:uppercase;color:var(--muted)}
.two{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.seg{display:flex;gap:8px;flex-wrap:wrap}
.seg-o{cursor:pointer}
.seg-o input{position:absolute;opacity:0;pointer-events:none}
.seg-o span{display:inline-flex;font:500 12px var(--f-mono);letter-spacing:.06em;text-transform:uppercase;border:1px solid var(--line-2);color:var(--muted);border-radius:8px;padding:8px 12px}
.seg-o input:checked+span.work,.seg-o input:checked+span.cert,.seg-o input:checked+span.link{border-width:1px;border-style:solid}
.seg-o input:checked+span.work{color:var(--accent);background:rgba(60,210,255,.12);border-color:var(--accent)}
.seg-o input:checked+span.cert{color:var(--gold);background:rgba(242,189,79,.12);border-color:var(--gold)}
.seg-o input:checked+span.link{color:var(--violet);background:rgba(169,156,255,.12);border-color:var(--violet)}
.seg-o input:focus-visible+span{outline:2px solid var(--accent);outline-offset:2px}
.err{margin:0;color:var(--danger);font-size:13px;min-height:0}
.err:empty{display:none}
.hint{color:var(--muted);font-size:13px;margin:0}
.actions{display:flex;gap:8px;justify-content:flex-end;flex-wrap:wrap}
.actions .sp{margin-right:auto}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(20px + env(safe-area-inset-bottom,0px));z-index:50;background:var(--panel-2);border:1px solid var(--line-2);border-radius:10px;padding:10px 16px;font-size:14px;box-shadow:0 12px 40px rgba(0,0,0,.5);max-width:calc(100vw - 32px)}

@media (max-width:900px){
  .shell{grid-template-columns:minmax(0,1fr);gap:16px}
  .side{position:static;max-height:none;padding:16px}
  .brand{flex-direction:row;align-items:center;gap:14px}
  .logo{width:72px}
  .nav{flex-direction:row;overflow-x:auto;gap:6px;padding-bottom:4px}
  .navitem{flex:none;grid-template-columns:auto auto auto;border:1px solid var(--line);padding:7px 12px}
  .navitem.on{border-color:rgba(60,210,255,.5)}
  .ni-idx{display:none}
  .navitem:not(.on) .ni-n.zero{display:none}
  .two{grid-template-columns:1fr}
}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
</style>
</head>

  function uid(){return Math.random().toString(36).slice(2,9);}
  function todayISO(){var d=new Date(),m=d.getMonth()+1,day=d.getDate();return d.getFullYear()+'-'+(m<10?'0':'')+m+'-'+(day<10?'0':'')+day;}
  function fmtDate(s){if(!s)return '—';var d=new Date(s+'T00:00:00');return isNaN(d)?'—':d.toLocaleDateString('uk-UA',{day:'2-digit',month:'2-digit',year:'numeric'});}
  function normUrl(u){
    u=u.trim();if(!u)return '';
    if(!/^[a-z][a-z0-9+.\-]*:/i.test(u))u='https://'+u;
    try{var x=new URL(u);if(x.protocol!=='http:'&&x.protocol!=='https:')return '';return x.href;}catch(e){return '';}
  }
  function hostLabel(u){
    try{var x=new URL(u),t=x.hostname.replace(/^www\./,'')+(x.pathname!=='/'?x.pathname:'');return t.length>44?t.slice(0,43)+'…':t;}catch(e){return u;}
  }

  var API='/api/portfolio',PWKEY='cyber-portfolio-pw';
  var PUB=null;try{PUB=JSON.parse($('published').textContent);}catch(e){}
  var editMode=(location.hash||'')==='#edit';
  var state=normalize(PUB),readOnly=true,authed=false,pw='',loadOk=false;
  var ui={sec:'s1',type:'all',q:''};
  try{var a=localStorage.getItem(ACTIVE);if(a)ui.sec=a;}catch(e){}
  function ensureSec(){if(!state.sections.some(function(s){return s.id===ui.sec;}))ui.sec=state.sections[0].id;}

  /* ---------- save to site ---------- */
  var timer=null,saving=false,dirty=false;
  function setSync(k){
    var map={saved:'Збережено на сайті',saving:'Збереження…',error:'Не вдалося зберегти. Спробуйте ще раз',ro:'Режим перегляду'};
    $('sync').className='sync '+(k==='saved'?'cloud':k);$('syncT').textContent=map[k];
  }
  function post(body){
    return fetch(API,{method:'POST',headers:{'content-type':'application/json'},body:JSON.stringify(body)}).then(function(r){
      return r.json().catch(function(){return {};}).then(function(j){return {status:r.status,body:j};});
    });
  }
  function forget(){pw='';try{sessionStorage.removeItem(PWKEY);}catch(e){}}
  function flush(){
    timer=null;
    if(saving){dirty=true;return;}
    saving=true;
    (async function(){
      try{
        do{
          dirty=false;
          var res=await post({password:pw,data:state});
          if(res.status===401){authed=false;readOnly=true;saving=false;forget();applyMode();renderAll();loginDlg('Пароль більше не діє. Увійдіть знову.');return;}
          if(res.status!==200)throw 0;
        }while(dirty);
        setSync('saved');
      }catch(e){setSync('error');}
      saving=false;
    })();
  }
  function commit(){
    renderNav();renderMain();renderSide();
    if(authed){setSync('saving');clearTimeout(timer);timer=setTimeout(flush,500);}
  }
  function renderAll(){ensureSec();renderSide();renderNav();renderMain();}
  function applyMode(){
    $('editProfile').hidden=readOnly;$('addSec').hidden=readOnly;
    document.querySelector('.tools').hidden=!authed;
  }
  function loginDlg(msg){
    var err=h('p',{class:'err',role:'alert',text:msg||''});
    var inp=h('input',{class:'field',id:'l-pw',type:'password',autocomplete:'current-password',placeholder:'Пароль власника'});
    var btn=h('button',{class:'btn primary',type:'submit',text:'Увійти'});
    var form=h('form',{novalidate:true},
      field('Пароль','l-pw',inp,'Пароль ви задаєте в налаштуваннях сайту на Netlify.'),err,
      h('div',{class:'actions'},h('button',{class:'btn',type:'button',onclick:closeDlg,text:'Скасувати'}),btn));
    form.addEventListener('submit',function(ev){
      ev.preventDefault();
      var v=inp.value;
      if(!v){err.textContent='Введіть пароль.';return;}
      if(!loadOk){err.textContent='Дані сайту не завантажились. Оновіть сторінку.';return;}
      btn.disabled=true;err.textContent='';
      post({password:v,verify:true}).then(function(res){
        btn.disabled=false;
        if(res.status===200){pw=v;try{sessionStorage.setItem(PWKEY,v);}catch(e){}authed=true;readOnly=false;closeDlg();applyMode();renderAll();setSync('saved');toast('Режим редагування увімкнено');}
        else if(res.status===401)err.textContent='Неправильний пароль.';
        else if(res.status===503)err.textContent='Пароль ще не задано. Додайте змінну EDIT_PASSWORD у налаштуваннях Netlify.';
        else err.textContent='Сервер не відповідає. Перевірте, що функція розгорнута на Netlify.';
      }).catch(function(){btn.disabled=false;err.textContent='Немає зв’язку із сервером.';});
    });
    openDlg('Вхід для власника',form);
  }

  /* ---------- helpers ---------- */
  function sec(id){return state.sections.filter(function(s){return s.id===id;})[0];}
  function secItems(id){return state.items.filter(function(i){return i.sec===id;});}
  function secIndexLabel(s){var m=/^s(\d+)$/.exec(s.id);return m?(m[1].length<2?'0':'')+m[1]:'•';}
  function slug(s){var m=/^s(\d+)$/.exec(s.id);return m?'семестр-'+m[1]:s.title.toLowerCase().replace(/[^a-zа-яіїєґ0-9]+/g,'-').replace(/^-|-$/g,'');}
  function toast(t){var e=$('toast');e.textContent=t;e.hidden=false;clearTimeout(toast.t);toast.t=setTimeout(function(){e.hidden=true;},2600);}

  /* ---------- dialog ---------- */
  var dlg=$('dlg');
  dlg.addEventListener('click',function(e){if(e.target===dlg)closeDlg();});
  function closeDlg(){try{dlg.close();}catch(e){dlg.removeAttribute('open');}}
  function openDlg(title,body){
    dlg.replaceChildren(h('div',{class:'dlg-in'},
      h('div',{class:'dlg-h'},h('h2',{text:title}),h('button',{class:'icon-btn',type:'button','aria-label':'Закрити',onclick:closeDlg},icon('x'))),
      body));
    if(!dlg.open){try{dlg.showModal();}catch(e){dlg.setAttribute('open','');}}
    var f=dlg.querySelector('input:not([type=radio]),textarea');if(f)f.focus();
  }
  function field(label,id,control,hint){
    return h('div',{class:'fld'},h('label',{for:id,text:label}),control,hint?h('p',{class:'hint',text:hint}):null);
  }

  function itemDlg(item){
    var d=Object.assign({type:ui.type==='all'?'work':ui.type,title:'',course:'',url:'',date:todayISO(),note:''},item||{});
    var err=h('p',{class:'err',role:'alert'});
    var title=h('input',{class:'field',id:'f-title',name:'title',value:d.title,maxlength:'160',placeholder:'Наприклад: Лабораторна №3. Аналіз трафіку у Wireshark',autocomplete:'off'});
    var course=h('input',{class:'field',id:'f-course',name:'course',value:d.course,maxlength:'120',placeholder:'Дисципліна або тема',autocomplete:'off'});
    var url=h('input',{class:'field',id:'f-url',name:'url',value:d.url,placeholder:'https://github.com/…',inputmode:'url',autocomplete:'off'});
    var date=h('input',{class:'field',id:'f-date',name:'date',type:'date',value:d.date});
    var note=h('textarea',{class:'field',id:'f-note',name:'note',maxlength:'400',placeholder:'Коротко: що зроблено, які інструменти'},d.note);
    var seg=h('div',{class:'seg',role:'radiogroup','aria-label':'Тип запису'},Object.keys(TYPES).map(function(k){
      return h('label',{class:'seg-o'},h('input',{type:'radio',name:'type',value:k,checked:d.type===k?true:null}),h('span',{class:k,text:TYPES[k].label}));
    }));
    var form=h('form',{novalidate:true},
      h('div',{class:'fld'},h('span',{class:'l',text:'Тип'}),seg),
      field('Назва','f-title',title),
      h('div',{class:'two'},field('Дисципліна','f-course',course),field('Дата','f-date',date)),
      field('Посилання','f-url',url,'Репозиторій, диск, сторінка сертифіката. Можна залишити порожнім.'),
      field('Нотатка','f-note',note),
      err,
      h('div',{class:'actions'},
        h('button',{class:'btn',type:'button',onclick:closeDlg,text:'Скасувати'}),
        h('button',{class:'btn primary',type:'submit',text:item?'Зберегти':'Додати'})));
    form.addEventListener('submit',function(ev){
      ev.preventDefault();
      var t=title.value.trim();
      if(!t){err.textContent='Вкажіть назву запису.';title.focus();return;}
      var u=url.value.trim();
      if(u){u=normUrl(u);if(!u){err.textContent='Посилання виглядає неправильно. Приклад: https://github.com/user/repo';url.focus();return;}}
      var type=form.querySelector('input[name=type]:checked').value;
      var rec={type:type,title:t,course:course.value.trim(),url:u,date:date.value,note:note.value.trim()};
      if(item){Object.assign(item,rec);delete item.example;}
      else state.items.push(Object.assign({id:uid(),sec:ui.sec},rec));
      closeDlg();commit();toast(item?'Запис оновлено':'Запис додано');
    });
    openDlg(item?'Редагувати запис':'Новий запис',form);
  }

  function secDlg(s){
    var isNew=!s;
    var title=h('input',{class:'field',id:'s-title',value:s?s.title:'',maxlength:'60',placeholder:'Наприклад: Практика, CTF, Курсова',autocomplete:'off'});
    var desc=h('textarea',{class:'field',id:'s-desc',maxlength:'240',placeholder:'Про що цей розділ'},s?s.desc:'');
    var err=h('p',{class:'err',role:'alert'});
    var custom=s&&!/^s\d+$/.test(s.id)&&s.id!=='x';
    var delBtn=null;
    if(custom){
      var armed=false;
      delBtn=h('button',{class:'btn danger sp',type:'button',text:'Видалити розділ',onclick:function(){
        var n=secItems(s.id).length;
        if(!armed){armed=true;delBtn.textContent='Видалити разом із записами ('+n+')?';return;}
        state.sections=state.sections.filter(function(x){return x.id!==s.id;});
        state.items=state.items.filter(function(i){return i.sec!==s.id;});
        ensureSec();closeDlg();commit();toast('Розділ видалено');
      }});
    }
    var form=h('form',{novalidate:true},
      field('Назва розділу','s-title',title),field('Опис','s-desc',desc),err,
      h('div',{class:'actions'},delBtn,
        h('button',{class:'btn',type:'button',onclick:closeDlg,text:'Скасувати'}),
        h('button',{class:'btn primary',type:'submit',text:isNew?'Створити':'Зберегти'})));
    form.addEventListener('submit',function(ev){
      ev.preventDefault();
      var t=title.value.trim();if(!t){err.textContent='Вкажіть назву розділу.';title.focus();return;}
      if(isNew){var ns={id:'c'+uid(),title:t,desc:desc.value.trim()};state.sections.push(ns);ui.sec=ns.id;ui.type='all';ui.q='';}
      else{s.title=t;s.desc=desc.value.trim();}
      closeDlg();commit();
    });
    openDlg(isNew?'Новий розділ':'Налаштування розділу',form);
  }

  function profileDlg(){
    var name=h('input',{class:'field',id:'p-name',value:state.profile.name,maxlength:'60',autocomplete:'off'});
    var role=h('input',{class:'field',id:'p-role',value:state.profile.role,maxlength:'80',autocomplete:'off',placeholder:'Група, курс, спеціальність'});
    var form=h('form',{novalidate:true},
      field('Ім’я','p-name',name),field('Підпис','p-role',role),
      h('div',{class:'actions'},h('button',{class:'btn',type:'button',onclick:closeDlg,text:'Скасувати'}),h('button',{class:'btn primary',type:'submit',text:'Зберегти'})));
    form.addEventListener('submit',function(ev){ev.preventDefault();state.profile.name=name.value.trim()||'Ваше ім’я';state.profile.role=role.value.trim();closeDlg();commit();});
    openDlg('Профіль',form);
  }

  function importDlg(obj){
    var n=obj.items.length,m=obj.sections.length;
    openDlg('Замінити дані?',h('div',{class:'dlg-in',style:'padding:0'},
      h('p',{class:'hint',text:'У файлі '+m+' розділів і '+n+' записів. Поточні дані портфоліо буде замінено.'}),
      h('div',{class:'actions'},h('button',{class:'btn',type:'button',onclick:closeDlg,text:'Скасувати'}),
        h('button',{class:'btn primary',type:'button',text:'Замінити',onclick:function(){state=normalize(obj);ensureSec();closeDlg();commit();toast('Дані імпортовано');}}))));
  }

  /* ---------- render ---------- */
  function renderSide(){
    $('who').textContent=state.profile.name;
    $('role').textContent=state.profile.role;
  }
  function renderNav(){
    ensureSec();
    $('nav').replaceChildren.apply($('nav'),state.sections.map(function(s){
      var n=secItems(s.id).length;
      return h('button',{class:'navitem'+(s.id===ui.sec?' on':''),type:'button','aria-current':s.id===ui.sec?'true':null,onclick:function(){select(s.id);}},
        h('span',{class:'ni-idx',text:secIndexLabel(s)}),h('span',{class:'ni-t',text:s.title}),h('span',{class:'ni-n'+(n?'':' zero'),text:String(n)}));
    }));
  }
  function select(id){
    ui.sec=id;ui.type='all';ui.q='';
    try{localStorage.setItem(ACTIVE,id);}catch(e){}
    renderNav();renderMain();
    window.scrollTo({top:0});
  }
  function visibleItems(){
    var q=ui.q.trim().toLowerCase();
    return secItems(ui.sec).filter(function(i){
      if(ui.type!=='all'&&i.type!==ui.type)return false;
      if(!q)return true;
      return (i.title+' '+i.course+' '+i.note+' '+i.url).toLowerCase().indexOf(q)>-1;
    }).sort(function(a,b){return (b.date||'').localeCompare(a.date||'');});
  }
  function renderMain(){
    ensureSec();
    var s=sec(ui.sec),items=secItems(s.id);
    var cnt={work:0,cert:0,link:0};items.forEach(function(i){cnt[i.type]++;});
    var hasEx=state.items.some(function(i){return i.example;});
    var main=$('main');
    var head=h('div',{},
      h('div',{class:'crumb'},'~/портфолио/',h('b',{text:slug(s)})),
      h('div',{class:'headrow'},
        h('h1',{text:s.title}),
        readOnly?null:h('button',{class:'btn small',type:'button',onclick:function(){secDlg(s);}},icon('edit'),'Налаштувати розділ')),
      s.desc?h('p',{class:'desc',text:s.desc}):null,
      h('div',{class:'stats'},
        h('span',{},h('i',{class:'sw work'}),'Роботи ',h('b',{text:String(cnt.work)})),
        h('span',{},h('i',{class:'sw cert'}),'Сертифікати ',h('b',{text:String(cnt.cert)})),
        h('span',{},h('i',{class:'sw link'}),'Посилання ',h('b',{text:String(cnt.link)}))));
    var notice=(hasEx&&!readOnly)?h('div',{class:'notice'},
      h('span',{text:'У портфоліо є приклади. Вони позначені «ПРИКЛАД», щоб ви бачили, як виглядає заповнена таблиця.'}),
      h('button',{class:'btn small',type:'button',text:'Видалити всі приклади',onclick:function(){state.items=state.items.filter(function(i){return !i.example;});commit();toast('Приклади видалено');}})):null;
    var editBar=editMode?(readOnly?h('div',{class:'notice'},h('span',{text:'Редагування вимкнено. Увійдіть як власник.'}),h('button',{class:'btn small',type:'button',text:'Увійти',onclick:function(){loginDlg();}})):h('div',{class:'notice'},h('span',{text:'Режим редагування. Зміни зберігаються на сайті автоматично й одразу видимі всім.'}))):null;
    var filters=h('div',{class:'filters',role:'group','aria-label':'Фільтр за типом'},
      [['all','Усі',items.length],['work','Роботи',cnt.work],['cert','Сертифікати',cnt.cert],['link','Посилання',cnt.link]].map(function(f){
        return h('button',{class:'filt'+(ui.type===f[0]?' on':''),type:'button','aria-pressed':ui.type===f[0]?'true':'false',onclick:function(){ui.type=f[0];renderMain();}},f[1],h('em',{text:String(f[2])}));
      }));
    var search=h('div',{class:'search'},h('input',{type:'search',id:'q',value:ui.q,placeholder:'Пошук за назвою, дисципліною, посиланням','aria-label':'Пошук',autocomplete:'off',oninput:function(e){ui.q=e.target.value;renderList();}}));
    var add=readOnly?null:h('button',{class:'btn primary',type:'button',onclick:function(){itemDlg(null);}},icon('plus'),'Додати запис');
    var list=h('div',{id:'list'});
    var foot=h('p',{class:'foot',text:'Особистий портфоліо-сайт студента. Не є офіційним сайтом інституту.'});
    main.replaceChildren.apply(main,[head,editBar,notice,h('div',{class:'toolbar'},filters,search,add),list,foot].filter(Boolean));
    renderList();
  }
  function renderList(){
    var list=$('list');if(!list)return;
    var all=secItems(ui.sec),rows=visibleItems();
    if(!rows.length){
      var s=sec(ui.sec),none=!all.length;
      list.replaceChildren(h('div',{class:'tablewrap'},h('div',{class:'empty'},
        h('div',{class:'term'},'$ ls ',h('b',{text:slug(s)+'/'}),h('br'),none?'total 0':'збігів: 0'),
        h('p',{text:none?(readOnly?'У цьому розділі поки нічого немає.':'У цьому розділі поки порожньо. Додайте першу роботу або посилання на сертифікат.'):'Нічого не знайдено. Змініть запит або фільтр.'}),
        (none&&!readOnly)?h('button',{class:'btn primary',type:'button',onclick:function(){itemDlg(null);}},icon('plus'),'Додати запис'):null)));
      return;
    }
    var tbody=h('tbody',{},rows.map(function(i){
      var act=null;
      if(!readOnly){
        var del=h('button',{class:'icon-btn',type:'button','aria-label':'Видалити запис'},icon('trash'));
        var armed=false,tm;
        del.addEventListener('click',function(){
          if(!armed){armed=true;del.className='icon-btn armed';del.textContent='Видалити?';tm=setTimeout(function(){armed=false;del.className='icon-btn';del.replaceChildren(icon('trash'));},3000);return;}
          clearTimeout(tm);state.items=state.items.filter(function(x){return x.id!==i.id;});commit();toast('Запис видалено');
        });
        act=h('div',{},h('button',{class:'icon-btn',type:'button','aria-label':'Редагувати запис',onclick:function(){itemDlg(i);}},icon('edit')),del);
      }
      return h('tr',{},
        h('td',{},h('span',{class:'badge t-'+i.type,text:TYPES[i.type].label})),
        h('td',{class:'c-title'},h('strong',{},i.title,i.example?h('span',{class:'ex',text:'ПРИКЛАД'}):null),
          i.course?h('small',{text:i.course}):null,i.note?h('span',{class:'note',text:i.note}):null),
        h('td',{},i.url?h('a',{class:'ext',href:i.url,target:'_blank',rel:'noopener noreferrer'},hostLabel(i.url),icon('ext')):h('span',{class:'none',text:'—'})),
        h('td',{class:'c-date',text:fmtDate(i.date)}),
        h('td',{class:'c-act'},act));
    }));
    list.replaceChildren(h('div',{class:'tablewrap'},h('table',{},
      h('thead',{},h('tr',{},h('th',{text:'Тип'}),h('th',{text:'Назва'}),h('th',{text:'Посилання'}),h('th',{text:'Дата'}),h('th',{'aria-label':'Действия'}))),tbody)));
  }

  /* ---------- buttons ---------- */
  $('editProfile').append(icon('user'),'Профіль');
  $('addSec').append(icon('plus'),'Новий розділ');
  $('importBtn').append(icon('up'),'Імпорт');
  $('exportBtn').append(icon('down'),'Резервна копія');
  $('editProfile').addEventListener('click',profileDlg);
  $('addSec').addEventListener('click',function(){secDlg(null);});
  $('importBtn').addEventListener('click',function(){$('importFile').click();});
  $('exitBtn').addEventListener('click',function(){forget();location.hash='';location.reload();});
  $('exportBtn').addEventListener('click',function(){
    var blob=new Blob([JSON.stringify(state,null,2)],{type:'application/json'});
    var a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download='cyber-portfolio-backup.json';
    document.body.append(a);a.click();a.remove();
    setTimeout(function(){URL.revokeObjectURL(a.href);},2000);
  });
  $('importFile').addEventListener('change',function(e){
    var f=e.target.files&&e.target.files[0];e.target.value='';if(!f)return;
    var r=new FileReader();
    r.onload=function(){
      try{var o=JSON.parse(String(r.result));if(!o||!Array.isArray(o.sections)||!Array.isArray(o.items))throw 0;importDlg(o);}
      catch(x){toast('Файл не схожий на експорт портфоліо');}
    };
    r.readAsText(f);
  });
  window.addEventListener('hashchange',function(){location.reload();});

  renderAll();setSync('ro');applyMode();
  fetch(API,{cache:'no-store'}).then(function(r){if(!r.ok)throw 0;return r.json();}).then(function(d){
    loadOk=true;
    if(d&&Array.isArray(d.sections)){state=normalize(d);renderAll();}
  }).catch(function(){}).then(function(){
    if(!editMode)return;
    if(!loadOk){toast('Не вдалося завантажити дані сайту. Оновіть сторінку.');renderMain();return;}
    var saved='';try{saved=sessionStorage.getItem(PWKEY)||'';}catch(e){}
    if(!saved){renderMain();loginDlg();return;}
    post({password:saved,verify:true}).then(function(res){
      if(res.status===200){pw=saved;authed=true;readOnly=false;applyMode();renderAll();setSync('saved');}
      else{forget();renderMain();loginDlg();}
    }).catch(function(){renderMain();loginDlg();});
  });
})();
</script>

</body>
</html>
